# Alembic settings for the label-task-queue database.
#
# Run alembic from the repository root, for example:
#   alembic upgrade head                      create or update labelflow.db
#   DATABASE_URI=sqlite:////data/labelflow.db alembic upgrade head
#   alembic revision --autogenerate -m "what changed"   (against a database at head)
#
# The database URL comes from the DATABASE_URI environment variable (default: labelflow.db in the
# current directory); see src/labelflow/store/migrations/env.py.

[alembic]
script_location = %(here)s/src/labelflow/store/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/src
path_separator = os

# Format new revision files like the rest of the code (needs ruff, a dev dependency).
[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
