# Two annotators read every image; an expert settles the images they disagreed on.
workflow: xray_adjudicated
dataset: xray_batch_1
label_task: image_ontology@1

stages:
  - name: annotate
    assign_to: annotator
    labels_per_item: 2              # every image read by 2 annotators

  - name: adjudicate
    input: annotate.disagreed       # only images where they disagreed
    assign_to: expert

final: [adjudicate, annotate]       # images that agree finalize from annotate
