[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "labelflow"
version = "0.1.0.dev0"
description = "label-task-queue: auditable labeling workflows for research data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "starlette==1.7.0",
    "pydantic==2.14.0",
    "SQLAlchemy==2.1.4",
    "alembic==1.20.0",
    "PyYAML==6.0.3",
    "numpy==2.5.4",
    "uvicorn==0.54.0",
    "pyarrow==26.0.0",
    # the server-rendered interface (labelflow.ui): templates and form posts
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.5",
    "ruff==0.17.0",
    # starlette's TestClient (used by fastapi.testclient) needs httpx2
    "httpx2==2.13.1",
]
# The browser test of the interface (tests/ui/test_browser.py) is skipped without this.
# 1.48 matches the Chromium build in ~/.cache/ms-playwright (chromium-1140); run
# `playwright install chromium` to download one.
browser = ["playwright==1.48.0"]
# The JSRT pilot kit (pilot/jsrt/prepare.py) reads mask images and writes PNGs with Pillow;
# tests/pilot is skipped without it.
pilot = ["pillow==12.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/labelflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
