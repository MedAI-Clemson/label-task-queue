<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mask tools spike (Canvas 2D)</title>
<style>
  :root { color-scheme: dark; --bg: #121317; --panel: #1f2128; --line: #343743; --text: #e6e6e6; --muted: #9aa0ad; --accent: #7cb0ff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: grid; grid-template-columns: 1fr 320px; grid-template-rows: auto 1fr auto; }
  header { grid-column: 1 / 3; display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header button, aside button { background: #2a2d36; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  header button.active { background: var(--accent); color: #000; border-color: var(--accent); }
  header label { display: inline-flex; gap: 4px; align-items: center; }
  #viewport { position: relative; overflow: hidden; background: #1b1d22; }
  #canvas { display: block; touch-action: none; cursor: crosshair; }
  aside { overflow: auto; padding: 10px; background: var(--panel); border-left: 1px solid var(--line); }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 6px; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { padding: 3px 0; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; }
  .area { color: var(--muted); font-size: 12px; margin-left: 6px; }
  #flags li.agree { color: #8fd49a; }
  #flags li.disagree { color: #ff9a8a; }
  #flags-caption { color: var(--muted); font-size: 12px; }
  select { background: #2a2d36; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
  textarea { width: 100%; height: 150px; font: 11px/1.3 monospace; background: #0d0e11; color: var(--text); border: 1px solid var(--line); }
  footer { grid-column: 1 / 3; padding: 4px 10px; background: var(--panel); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  kbd { background: #2a2d36; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<header>
  <button data-tool="brush" class="active" title="Brush (b)">Brush</button>
  <button data-tool="polygon" title="Polygon (p): click vertices, click the first one / double-click / Enter to close, Esc cancels, Backspace removes last">Polygon</button>
  <button data-tool="pan" title="Pan (h); also shift-drag or right/middle drag">Pan</button>
  <label><input type="checkbox" id="erase"> Erase (<kbd>e</kbd>)</label>
  <label>Brush <input type="range" id="brush-size" min="1" max="100" value="12"> <span id="brush-size-label">12 px</span></label>
  <button id="undo" title="Ctrl+Z">Undo</button>
  <button id="redo" title="Ctrl+Shift+Z">Redo</button>
  <button id="fit" title="Fit (f)">Fit</button>
  <span id="zoom">100%</span>
  <label><input type="checkbox" id="grid" checked> Pixel grid at 8x+</label>
</header>
<div id="viewport"><canvas id="canvas"></canvas></div>
<aside>
  <h2>Mask class</h2>
  <ul id="classes"></ul>
  <h2>Classifications</h2>
  <div id="classifications"></div>
  <h2>Earlier labels (layers)</h2>
  <ul id="layers"></ul>
  <h2>Agreement flags</h2>
  <p id="flags-caption"></p>
  <ul id="flags"></ul>
  <h2>Submit</h2>
  <label><input type="checkbox" id="compressed" checked> Compressed RLE counts</label><br>
  <button id="export">Export label JSON</button>
  <textarea id="output" readonly placeholder="POST .../slots/{slot}/submit body"></textarea>
</aside>
<footer id="status">Loading...</footer>
<script type="module" src="app.js"></script>
</body>
</html>
