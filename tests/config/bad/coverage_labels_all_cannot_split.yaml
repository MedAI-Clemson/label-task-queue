workflow: xray_main
dataset: xray_batch_1
label_task: image_ontology@1

stages:
  - name: annotate
    assign_to: annotator
    labels_per_item: all

  - name: adjudicate
    input: annotate.disagreed
    assign_to: expert

  - name: confirm
    input: annotate.agreed
    assign_to: expert

final: [adjudicate, confirm]
