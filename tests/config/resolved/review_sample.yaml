# The resolved config of workflow 'xray_main': every default is filled in.
workflow: xray_main
dataset: xray_batch_1
label_task: image_ontology@1

stages:
  - name: annotate
    input: null                     # every item of the dataset 'xray_batch_1'
    assign_to: [annotator]
    sample: 1.0                     # every arriving item enters
    labels_per_item: 1              # each item is labeled once
    score_against: null             # labels are not scored against a key
    show_prior: true                # labelers see earlier labels

  - name: expert_review
    input: annotate                 # every item that completed 'annotate'
    assign_to: [expert]
    sample: 0.2                     # 20% of arriving items enter (by hashed draw)
    labels_per_item: 1              # each item is labeled once
    score_against: null             # labels are not scored against a key
    show_prior: true                # labelers see earlier labels

final: [expert_review, annotate]    # the first listed stage that labeled an item gives its label
