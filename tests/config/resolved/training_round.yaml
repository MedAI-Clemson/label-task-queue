# The resolved config of workflow 'training_round_1': every default is filled in.
workflow: training_round_1
dataset: gold_set_1
label_task: image_ontology@1

stages:
  - name: gold_read
    input: null                     # every item of the dataset 'gold_set_1'
    assign_to: [trainee]
    sample: 1.0                     # every arriving item enters
    labels_per_item: all            # everyone holding the roles at admission labels it
    score_against: gold_key         # each label is scored against the item property 'gold_key'
    show_prior: true                # labelers see earlier labels

final: none                         # this workflow produces no final labels
